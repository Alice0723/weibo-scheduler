name: 微博日程抓取

# 每天拉一次三个微博账号的动态，抽出日程写进 data/weibo-schedules.json。
# 小程序直接读这个 JSON（raw.githubusercontent.com），服务器零参与。
#
# 需要 2 个 Secret：
#   WEIBO_COOKIE   —— 微博 Cookie（必填）
#   ZHIPUAI_API_KEY —— 智谱 GLM-4-Flash 永久免费不限量（推荐）
#                     也可用 LLM_API_KEY / SILICONFLOW_API_KEY / DASHSCOPE_API_KEY
#
# ⚠️ 之前文档说的「用仓库自带的 GITHUB_TOKEN 走 GitHub Models」已失效 ——
#    GitHub Models 于 2026-07-30 彻底下线，inference API 不再可用。

on:
  schedule:
    # 每天 10:17（避开整点，减少 Actions 排队）
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '每个账号最多抓多少条'
        required: false
        default: '60'

permissions:
  contents: write   # 要把抓到的数据提交回仓库
  # ⚠️ 不再需要 models: read —— GitHub Models 已于 2026-07-30 下线

concurrency:
  group: weibo-fetch
  cancel-in-progress: true

jobs:
  fetch:
    name: 抓取并抽取
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚠️ 诊断步骤：把「到底是哪一环出问题」直接说清楚，
      #    免得只能看到一句 exit code 2 干瞪眼。
      #    只输出长度和是否含 SUB，绝不输出 Cookie 内容。
      - name: 环境自检
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: node -e "
          const c = process.env.WEIBO_COOKIE || '';
          console.log('--- 环境自检 ---');
          console.log('WEIBO_COOKIE 长度:', c.length);
          console.log('是否包含 SUB=  :', /(^|;\s*)SUB=/.test(c) ? '是' : '否  ← 问题在这');
          const keys = ['LLM_API_KEY','ZHIPUAI_API_KEY','SILICONFLOW_API_KEY','DASHSCOPE_API_KEY'];
          const found = keys.filter(k => process.env[k]);
          console.log('可用的 LLM Key :', found.length ? found.join(', ') : '无  ← 问题在这');
          if (!c) {
            console.log('');
            console.log('❌ Secret 没读到。检查：');
            console.log('   1. 名称必须是 WEIBO_COOKIE（全大写，下划线分隔）');
            console.log('   2. 要配在 Repository secrets，不是 Environment secrets');
            console.log('   3. 配好 Secret 后必须重新触发一次 workflow ——');
            console.log('      已经在跑的 run 拿不到新加的 Secret');
            process.exit(1);
          }
          if (!/(^|;\s*)SUB=/.test(c)) {
            console.log('');
            console.log('❌ Cookie 里没有 SUB= —— 微博会返回 432。');
            process.exit(1);
          }
          if (!found.length) {
            console.log('');
            console.log('❌ 没配 LLM Key，无法抽取日程。');
            console.log('   推荐 ZHIPUAI_API_KEY（智谱 GLM-4-Flash 永久免费）：');
            console.log('   https://open.bigmodel.cn → API Keys → 创建 → 复制 key');
            process.exit(1);
          }
          console.log('✓ 环境就绪');
        "

      - name: 抓取微博动态
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          WEIBO_RADIO_UID: ${{ secrets.WEIBO_RADIO_UID }}
          MAX_ITEMS_PER_SOURCE: ${{ github.event.inputs.limit || '60' }}
        run: node scripts/fetch-weibo.js

      - name: LLM 抽取日程
        env:
          # 任意一个配了就能用，按 extract-schedules.js 里的优先级探测
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: node scripts/extract-schedules.js

      - name: 提交结果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 更新微博日程 (${{ github.run_number }})'
          file_pattern: 'data/*.json'

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::微博日程抓取失败。最常见的原因是 WEIBO_COOKIE 过期了。"
          echo "::error::去仓库 Settings → Secrets and variables → Actions 重新粘贴一份微博 Cookie 即可。"
          echo "::error::复制的 Cookie 必须包含 SUB= 这一段，否则微博一律返回 432。"
